[package]
name = "ghostty-vt-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
links = "ghostty-vt"
build = "build.rs"

[lib]
doctest = false

[features]
default = []
bindgen-tool = ["dep:bindgen", "dep:heck", "dep:libc"]

[dependencies]
bindgen = { version = "0.72", optional = true }
heck = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1.2"

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
