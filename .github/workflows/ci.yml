name: Required CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    name: Source, recovery, browser, security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm test:e2e
      - run: pnpm test:recovery
      - run: pnpm test:backup-restore
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-failure-artifacts, path: test-results, retention-days: 7 }
  soak:
    name: Checked 100k-event soak
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:soak:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: soak-summary, path: test-results/soak-summary.json, retention-days: 14 }
  packaged:
    name: Packaged smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: { os: [macos-14, windows-2022, ubuntu-24.04] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:server:packaged
      - name: Packaged smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:electron:packaged
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'false'
      - name: Packaged smoke (macOS/Windows)
        if: runner.os != 'Linux'
        run: pnpm test:electron:packaged
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaged-smoke-${{ matrix.os }}
          path: test-results
          retention-days: 7
