<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://* https://* ws://* wss://*"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A local workspace for supervising PI coding agents." />
    <script>
      try {
        if (localStorage.getItem('pideck-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#171717');
        }
      } catch {
        // Ignore unavailable storage in privacy-restricted browsers.
      }
    </script>
    <title>piDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
