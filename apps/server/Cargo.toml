[package]
name = "pideck-server"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "yaade"
path = "src/main.rs"

[features]
default = []
embedded-web = ["yaade-server/embedded-web"]

[dependencies]
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
yaade-server = { path = "../../packages/yaade-server" }

[dev-dependencies]
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
ring = "0.17"
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.28"
