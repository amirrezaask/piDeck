[package]
name = "yaade-server"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "yaade_server"
path = "src/lib.rs"

[[bin]]
name = "yaade"
path = "src/main.rs"

[features]
default = []
embedded-web = ["dep:include_dir"]

[dependencies]
axum = { version = "0.8", features = ["http2", "ws"] }
base64 = "0.22"
bytes = "1.10"
crossbeam-channel = "0.5"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.3"
hostname = "0.4"
include_dir = { version = "0.7", optional = true }
indexmap = "2.12"
jiff = "0.2"
mime_guess = "2.0"
percent-encoding = "2.3"
portable-pty = "0.9"
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "limit", "trace"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
vt100 = "0.16"

[dev-dependencies]
pretty_assertions = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3.27"
tokio-tungstenite = "0.28"
